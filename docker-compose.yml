services:
  scraping:
    profiles: ["scraping","all"]
    container_name: scraping
    build: 
      context: ./WebScraping
    volumes:
      # Mappa la cartella locale per persistere i cache
      - ./WebScraping/cache:/app/cache
    environment:
      - BOXOFFICE_SINK_URL=http://fluentbit:9880/topBoxOffice
      - REVIEWS_SINK_URL=http://fluentbit:9880/reviewFilm
      - DELAY=0.2
      - LOOP=false
      - TIMEOUT=5
    depends_on:
      - fluentbit
    networks:
      - appnet
    
  fluentbit:
    profiles: ["scraping","all"]
    image: fluent/fluent-bit:3.2
    container_name: fluentbit
    volumes:
      - ./fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    networks:
      - appnet
    mem_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M

  kafka:
    profiles: ["kafka", "clk","all"]
    image: apache/kafka:4.0.1
    container_name: kafka
    networks:
        - appnet
    ports:
      - 3030:3030
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    
    deploy:
      resources:
        limits:
          cpus: '1' 
    
  kafka-ui:
    profiles: ["kafka-ui"]
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - appnet

  topic-creator:
    profiles: ["kafka-topic","all"]
    image: apache/kafka:4.0.1
    depends_on:
      - kafka
    networks:
        - appnet
    entrypoint: ["/bin/bash","-lc"]
    command: |
      "
      sleep 10;
      /opt/kafka/bin/kafka-topics.sh --create --topic topboxoffice --bootstrap-server kafka:9092
      /opt/kafka/bin/kafka-topics.sh --create --topic reviewFilm --bootstrap-server kafka:9092
      /opt/kafka/bin/kafka-topics.sh --create --topic revisedReview --bootstrap-server kafka:9092

      "
  connect-init:
    profiles: ["connect-init", "clk","all"]
    image: curlimages/curl:8.6.0
    depends_on:
      - kafka-connect
      - elasticsearch
    environment:
      CONNECT_URL: "http://kafka-connect:8083"
    container_name: connect-init
    networks:
      - appnet
    volumes:
      - ./scripts/init-connector.sh:/init-connector.sh:ro
    entrypoint: ["/bin/sh","-c"]
    command: |
      "
      sleep 10;
      /init-connector.sh
      "
    restart: "no"


  # consumer per output
  kafka-dump:
    profiles: ["kafka-debug"]
    image: apache/kafka:4.0.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash","-lc"]
    command: 
      - |
        for i in {1..60}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          echo "Waiting for Kafka..."
          sleep 2
        done
        echo "Starting consumer on topic revisedReview..."
        exec /opt/kafka/bin/kafka-console-consumer.sh \
          --bootstrap-server kafka:9092 \
          --topic revisedReview \
          --from-beginning \
          --property print.timestamp=true \
          --property print.key=true \
          --property print.value=true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - appnet

  kafka-connect:
    profiles: ["visual", "clk","all"]
    image: confluentinc/cp-kafka-connect:8.0.0
    container_name: kafka-connect
    platform: linux/amd64
    depends_on:
      - kafka
    ports:
      - 8083:8083
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_OFFSET_STORAGE_PARTITIONS: "1"        
      CONNECT_CONFIG_STORAGE_PARTITIONS: "1"        
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"  
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
      CONNECT_LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR"
      CONNECT_LOG4J_APPENDER_STDOUT_LAYOUT_CONVERSIONPATTERN: "[%d] %p %X{connector.context}%m (%c:%L)%n"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/data/connect-jars
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_OFFSET_STORAGE_CLEANUP_POLICY: "compact"
      CONNECT_CONFIG_STORAGE_CLEANUP_POLICY: "compact"
      CONNECT_STATUS_STORAGE_CLEANUP_POLICY: "compact"
    volumes:
      - $PWD/data:/data
    command:
      - bash
      - -lc
      - |
        echo "Installing Connector"
        confluent-hub install --no-prompt confluentinc/kafka-connect-elasticsearch:15.1.1
        #
        echo "Launching Kafka Connect worker"
        /etc/confluent/docker/run 
        #
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    networks:
        - appnet
    deploy:
      resources:
        limits:
          cpus: '0.5'

  elasticsearch:
    container_name: elasticsearch
    profiles: ["visual", "clk","all"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS= -Xms256m -Xmx256m
    depends_on:
      - kafka
    ports:
      - 9200:9200
    networks:
        - appnet
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  kibana:
    profiles: ["visual", "clk","all"]
    image: docker.elastic.co/kibana/kibana:8.15.1
    depends_on:
      - kafka
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 512m
    volumes:
    - kibana-data:/usr/share/kibana/data  
    deploy:
          resources:
            limits:
              memory: 512M
    ports: 
      - "5601:5601"
    networks:
      - appnet

  spark-app:
    profiles: ["sparkText","all"]
    image: apache/spark:4.0.2-python3
    depends_on:
      - kafka
    platform: linux/arm64
    container_name: spark-sentiment
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./models/script:/app
      - ./models/cinedata_bert_film:/models
      - spark-checkpoints:/tmp/spark-checkpoints
    entrypoint: ["/bin/bash", "-c"]
    user: root
    command: >
      "
      echo '=== Cleaning cache ===' &&
      rm -rf /root/.ivy2 &&
      echo '=== Installing dependencies ===' &&
      pip3 install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu &&
      pip3 install --no-cache-dir transformers protobuf sentencepiece pandas pyarrow &&
      echo '=== Starting Spark ===' &&
      /opt/spark/bin/spark-submit
      --master local[1]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.2
      --verbose
      --repositories https://repo1.maven.org/maven2
      --driver-memory 512m
      --executor-memory 512m
      --conf spark.driver.maxResultSize=256m
      --conf spark.sql.shuffle.partitions=1
      --conf spark.memory.fraction=0.6
      --conf spark.memory.storageFraction=0.3
      --conf spark.executor.cores=1
      /app/sentiment_analysis.py
      "
    mem_limit: 2g
    mem_reservation: 1500m
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
volumes:
  kibana-data:
  spark-checkpoints: